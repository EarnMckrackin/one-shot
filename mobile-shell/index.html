<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>One Shot</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0f;
        --card: #1c1c26;
        --border: #3a3a4d;
        --text: #f0f0f5;
        --soft: #9090a8;
        --accent: #ef2b3d;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(239,43,61,0.18), transparent 35%), var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      }

      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 12px; color: var(--soft); }
      code {
        display: block;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #050507;
        border: 1px solid var(--border);
        color: var(--text);
        white-space: pre-wrap;
      }

      strong { color: var(--text); }
      .accent { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>One Shot</h1>
      <p>This native wrapper needs a running app URL.</p>
      <p><strong>For normal use:</strong> sync Capacitor with your deployed HTTPS URL.</p>
      <p><strong>For local testing:</strong> sync it with your desktop LAN URL while <span class="accent">npm run dev</span> is running.</p>
      <code>ONE_SHOT_APP_URL=https://your-deployment.vercel.app npm run mobile:sync</code>
    </main>
  </body>
</html>
