project_id = "one-shot"

[auth]
enabled = true
site_url = "https://one-shot-kappa.vercel.app"
additional_redirect_urls = [
  "https://one-shot-kappa.vercel.app/**",
  "https://one-shot-jvincentc-4157s-projects.vercel.app/**",
  "https://one-shot-git-main-jvincentc-4157s-projects.vercel.app/**",
  "http://localhost:3000/**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.rate_limit]
email_sent = 60

[auth.email.template.confirmation]
subject = "Confirm your OneShot account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your OneShot sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
